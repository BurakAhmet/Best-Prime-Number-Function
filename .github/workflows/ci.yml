name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUMBA_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run fast tests
        run: pytest -q -m "not slow"

      - name: Smoke CLI
        run: |
          python -c "from is_prime import is_prime; assert is_prime(17) and not is_prime(0) and not is_prime(1)"
          # Exit 0 = prime (must succeed under set -e)
          python is_prime.py 97
          # Exit 1 = not prime; with bash -e we must not treat that as a step failure
          if python is_prime.py 100; then
            echo "expected exit code 1 for composite 100" >&2
            exit 1
          fi

  performance:
    name: Performance vs baseline / base branch
    runs-on: ubuntu-latest
    # Single Python version is enough for timing checks
    steps:
      - name: Checkout PR head (or push commit)
        uses: actions/checkout@v4
        with:
          path: candidate

      # PR: compare against the PR base commit.
      # Push: compare against the previous commit on the branch (event.before).
      - name: Checkout baseline ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: baseline_src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r candidate/requirements.txt

      - name: Benchmark baseline ref
        working-directory: baseline_src
        run: |
          if [ ! -f benchmarks/compare_speed.py ]; then
            echo "Baseline tree has no benchmark script; using committed baseline.json from candidate"
            cp "$GITHUB_WORKSPACE/candidate/benchmarks/baseline.json" "$GITHUB_WORKSPACE/baseline_run.json"
          else
            NUMBA_NUM_THREADS=2 python benchmarks/compare_speed.py --repeats 3 --json "$GITHUB_WORKSPACE/baseline_run.json"
          fi

      - name: Benchmark candidate
        working-directory: candidate
        run: |
          NUMBA_NUM_THREADS=2 python benchmarks/compare_speed.py --repeats 3 --json "$GITHUB_WORKSPACE/candidate_run.json"

      - name: Compare candidate vs baseline ref (must not regress)
        working-directory: candidate
        run: |
          python benchmarks/check_regression.py \
            --baseline "$GITHUB_WORKSPACE/baseline_run.json" \
            --candidate "$GITHUB_WORKSPACE/candidate_run.json" \
            --threshold 0.20 \
            --min-ms 0.05

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: |
            baseline_run.json
            candidate_run.json
