name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUMBA_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[lint]"
      - run: ruff check best_prime/certificate.py best_prime/factor_ecm.py best_prime/factor_siqs.py
      - run: mypy

  no-compiler:
    name: Stdlib fallback (no compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Hide any committed native core
        run: rm -f is_prime_data/wheel_core.so is_prime_data/wheel_core.dylib
      - name: Install without compiling
        env:
          CC: /bin/false
        run: |
          python -m pip install --upgrade pip
          pip install --no-build-isolation -e ".[test]" || pip install -e ".[test]"
      - name: Assert stdlib path
        run: |
          python - <<'PY'
          from best_prime.is_prime import lab, _load_c_core
          assert not _load_c_core(), "native core must be absent in no-compiler job"
          info = lab(1_000_000_007)
          assert info["path"] == "python_wheel", info
          assert info["is_prime"] is True
          print("stdlib fallback OK:", info["path"])
          PY
      # test_is_prime.py imports numpy at module level; this job is stdlib-only.
      - run: pytest -q -m "not slow" tests/test_certificate.py tests/test_ntheory.py tests/test_cli.py

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: macos-latest
          - python-version: "3.12"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools for OpenMP wheel core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp || true

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,test]"

      - name: Build wheel_core.so
        if: runner.os != 'Windows'
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: bash scripts/compile_wheel_core.sh

      - name: Restriction linter
        if: runner.os != 'Windows'
        run: python3 scripts/check_restrictions.py

      - name: Wiki sync
        if: runner.os != 'Windows'
        run: python3 scripts/check_wiki_sync.py

      - name: Build library guide (MkDocs)
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict --site-dir /tmp/guide-site
          test -f /tmp/guide-site/index.html
          test -f /tmp/guide-site/api/index.html
          grep -q "is_prime" /tmp/guide-site/api/index.html

      - name: Run fast tests
        run: pytest -q -m "not slow"

      - name: Coverage (Linux 3.12)
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        run: |
          pip install pytest-cov
          pytest -q -m "not slow" --cov=best_prime --cov-report=term-missing --cov-report=xml
          test -f coverage.xml

      - name: Assert C engine on Linux
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from best_prime.is_prime import lab, _load_c_core
          assert _load_c_core(), "wheel_core.so missing after compile_wheel_core.sh"
          info = lab(1_000_000_007)
          assert info["path"] == "u64_wheel_c", info
          # Hard 64-bit: n−1 Pocklington when it settles, else cubic.
          info2 = lab(9_223_372_036_854_775_783)
          assert info2["path"] in {"u64_nm1", "u64_lehman_c"} and info2["is_prime"] is True, info2
          info3 = lab(10_000_000_000_000_000_000_000_013)
          assert info3["path"] in {"u128_nm1", "u128_lehman_c"} and info3["is_prime"] is True, info3
          print("C path OK:", info["path"], info2["path"], info3["path"])
          PY

      - name: Smoke CLI
        shell: bash
        run: |
          python -c "from best_prime.is_prime import is_prime; assert is_prime(17) and not is_prime(0) and not is_prime(1)"
          python -m best_prime 97
          if python -m best_prime 100; then
            echo "expected exit code 1 for composite 100" >&2
            exit 1
          fi
          python -m best_prime 1000000007 | tee "$RUNNER_TEMP/cli_out.txt"
          grep -q 'RESULT:  prime' "$RUNNER_TEMP/cli_out.txt"

  performance:
    name: E2E performance vs baseline / base branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (or push commit)
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout baseline ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: baseline_src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install build tools for OpenMP wheel core
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.22" "numba>=0.56"

      - name: Build wheel cores (candidate always; baseline if script exists)
        run: |
          bash candidate/scripts/compile_wheel_core.sh
          if [ -f baseline_src/scripts/compile_wheel_core.sh ]; then
            bash baseline_src/scripts/compile_wheel_core.sh
          fi

      - name: E2E benchmark baseline ref
        working-directory: baseline_src
        run: |
          if [ -f benchmarks/compare_e2e.py ]; then
            OMP_NUM_THREADS=2 python benchmarks/compare_e2e.py --repeats 3 --json "$GITHUB_WORKSPACE/e2e_baseline.json"
          elif [ -f "$GITHUB_WORKSPACE/candidate/benchmarks/e2e_results.json" ]; then
            cp "$GITHUB_WORKSPACE/candidate/benchmarks/e2e_results.json" "$GITHUB_WORKSPACE/e2e_baseline.json"
          else
            echo "No e2e harness on baseline; skipping gate inputs" >&2
            echo '{"repeats":0,"results":[]}' > "$GITHUB_WORKSPACE/e2e_baseline.json"
          fi

      - name: E2E benchmark candidate
        working-directory: candidate
        run: |
          OMP_NUM_THREADS=2 python benchmarks/compare_e2e.py --repeats 3 --json "$GITHUB_WORKSPACE/e2e_candidate.json"

      - name: Compare e2e TIME (primary perf gate)
        working-directory: candidate
        run: |
          python scripts/check_e2e_regression.py \
            --baseline "$GITHUB_WORKSPACE/e2e_baseline.json" \
            --candidate "$GITHUB_WORKSPACE/e2e_candidate.json" \
            --threshold 0.25 \
            --min-ms 1.0

      - name: In-process hot-loop snapshot (secondary, non-gating)
        working-directory: candidate
        run: |
          NUMBA_NUM_THREADS=2 OMP_NUM_THREADS=2 python benchmarks/compare_speed.py \
            --repeats 3 --json "$GITHUB_WORKSPACE/hot_candidate.json" || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: |
            e2e_baseline.json
            e2e_candidate.json
            hot_candidate.json

  wheel-smoke:
    name: Platform wheel (not py3-none-any)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1
          python -m pip install -U pip build
      - name: Build required-native wheel
        env:
          BEST_PRIME_REQUIRE_NATIVE: "1"
          BEST_PRIME_PORTABLE: "1"
        run: python -m build --wheel
      - name: Assert platform tag and native core inside
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          name = wheels[0].name
          assert "none-any" not in name, name
          assert "linux" in name or "manylinux" in name, name
          with zipfile.ZipFile(wheels[0]) as zf:
              so = [n for n in zf.namelist() if n.endswith("wheel_core.so")]
          assert so, f"wheel_core.so missing from {name}"
          print("ok", name, "contains", so[0])
          PY

  docker-smoke:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t best-prime:ci .
      - name: Smoke CLI (tiny + C-path n)
        run: |
          docker run --rm best-prime:ci 17
          docker run --rm best-prime:ci 1000000007

  attestation:
    name: Certificate of correctness
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools for OpenMP wheel core
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1
      - run: pip install -e ".[fast,test]"
      - run: bash scripts/compile_wheel_core.sh
      - name: Run gates and write attestation
        env:
          NUMBA_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
        run: |
          python3 scripts/check_restrictions.py
          python3 scripts/check_wiki_sync.py
          pytest -q -m "not slow"
          python - <<'PY'
          from best_prime import lab
          info = lab(1_000_000_007)
          assert info["path"] == "u64_wheel_c", info
          open("engine_sample.json", "w").write(
              __import__("json").dumps({"path": info["path"], "e2e_ms": info["e2e_ms"], "elapsed_ms": info["elapsed_ms"]}, indent=2)
          )
          PY
          python benchmarks/check_determinism.py --trials 3
          ATTEST_LINT=passed ATTEST_PYTEST=passed ATTEST_DETERMINISM=passed ATTEST_PYTHONS=3.12 \
            python3 scripts/write_attestation.py attestation.json
      - uses: actions/upload-artifact@v4
        with:
          name: correctness-attestation
          path: |
            attestation.json
            engine_sample.json
