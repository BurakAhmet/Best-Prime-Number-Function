# Daily / on-demand optimization yardstick.
# Records e2e + hard-path timings on a standing GitHub issue so rounds are
# trackable. Does not mutate the engine (that is an agent or human PR).
name: Optimize

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Europe/Istanbul (UTC+3)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: optimize-baseline
  cancel-in-progress: true

jobs:
  baseline:
    name: Record baseline + upsert Optimization log
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools for OpenMP wheel core
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1

      - run: pip install -e ".[fast]"
      - run: bash scripts/compile_wheel_core.sh

      - name: Snapshot e2e + hard-path timings
        run: |
          python3 scripts/optimize_baseline.py \
            --repeats 2 \
            --json optimize_baseline.json \
            --md optimize_baseline.md

      - uses: actions/upload-artifact@v4
        with:
          name: optimize-baseline
          path: |
            optimize_baseline.json
            optimize_baseline.md

      - name: Upsert Optimization log issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('optimize_baseline.md', 'utf8');
            const report = JSON.parse(fs.readFileSync('optimize_baseline.json', 'utf8'));
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'optimize/log';

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (_) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: '1d76db',
                  description: 'Standing log for scheduled optimization baselines',
                });
              }
            }

            await ensureLabel();
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });

            const pinBody = [
              '# Optimization log',
              '',
              'Scheduled **Optimize** workflow (08:00 Istanbul / 05:00 UTC) records a baseline here.',
              'Each comment is one round. Open a new issue from the **Optimization round** template',
              'and assign **Copilot** (or run Grok with the optimize-primes skill) to actually hunt.',
              '',
              'Rules: deterministic; no Miller–Rabin; no primesieve / `sympy.isprime` as engine;',
              'e2e CLI `TIME` is primary; read `docs/ALGORITHM_HISTORY.md` F1–F13.',
              '',
              `Latest SHA: \`${report.sha}\` · [this run](${runUrl})`,
            ].join('\n');

            let number;
            if (open.data.length) {
              number = open.data[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                title: 'Optimization log',
                body: pinBody,
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Optimization log',
                body: pinBody,
                labels: [label],
              });
              number = created.data.number;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: md + `\n[Actions run](${runUrl})\n`,
            });

            core.notice(`Posted optimize baseline on issue #${number}`);
