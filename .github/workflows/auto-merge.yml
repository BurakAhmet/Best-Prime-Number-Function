# Auto-merge same-repo PRs when CI + Determinism (and performance if present) are green.
#
# Do NOT use workflow_run: when Copilot (or other bots) finish CI, those Auto-merge runs
# sit in conclusion=action_required and never execute without a human approval click.
# Running on pull_request / check_suite uses the PR workflow permission model (same as CI).
name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to merge if gates green"
        required: true
        type: string

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.head_sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    name: Merge if gates green
    runs-on: ubuntu-latest
    steps:
      - name: Wait for required checks and merge
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const n = parseInt(process.env.PR_NUMBER_INPUT, 10);
              if (!n) { core.info('No PR number'); return; }
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: n })).data;
            } else if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
            } else if (context.eventName === 'check_suite') {
              const sha = context.payload.check_suite.head_sha;
              const pulls = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 50 });
              pr = pulls.data.find(p => p.head.sha === sha);
            }

            if (!pr) {
              core.info('No open PR to merge');
              return;
            }

            pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            if (pr.state !== 'open') {
              core.info('PR not open');
              return;
            }
            const names = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const headRef = (pr.head && pr.head.ref) || '';
            if (names.includes('optimize/candidate') || headRef.startsWith('optimize/auto-')) {
              core.info('Optimize candidate — skip generic auto-merge (Optimize examine owns merge)');
              return;
            }
            if (pr.draft) {
              core.info('Draft PR — skip');
              return;
            }
            const headFull = pr.head.repo && pr.head.repo.full_name;
            if (headFull !== `${owner}/${repo}`) {
              core.info('Fork PR — skip auto-merge');
              return;
            }

            const sha = pr.head.sha;
            core.info(`Evaluating PR #${pr.number} @ ${sha}`);

            const deadline = Date.now() + 12 * 60 * 1000;
            let testsGreen = false, detGreen = false, perfOk = false;

            while (Date.now() < deadline) {
              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });
              const runs = checks.data.check_runs.filter(c =>
                !/^Merge if gates green$/i.test(c.name)
              );
              core.info(JSON.stringify(runs.map(c => ({
                name: c.name, status: c.status, conclusion: c.conclusion,
              })), null, 2));

              const testJobs = runs.filter(c => /Tests \(Python/i.test(c.name));
              const detJobs = runs.filter(c => /determinism/i.test(c.name));
              const perf = runs.filter(c => /Performance/i.test(c.name));
              const pendingGate = [...testJobs, ...detJobs, ...perf].filter(c =>
                c.status !== 'completed'
              );

              testsGreen = testJobs.length >= 1 && testJobs.every(c =>
                c.status === 'completed' && c.conclusion === 'success');
              detGreen = detJobs.length >= 1 && detJobs.every(c =>
                c.status === 'completed' && c.conclusion === 'success');
              perfOk = perf.length === 0 || perf.every(c =>
                c.status === 'completed' && (c.conclusion === 'success' || c.conclusion === 'skipped'));

              if (testsGreen && detGreen && perfOk && pendingGate.length === 0) break;

              const failedGate = [...testJobs, ...detJobs, ...perf].some(c =>
                c.status === 'completed' && c.conclusion &&
                !['success', 'skipped', 'neutral'].includes(c.conclusion));
              if (failedGate) {
                core.info('A required gate failed — not merging');
                return;
              }

              core.info(`Waiting for gates (tests=${testsGreen} det=${detGreen} perf=${perfOk} pending=${pendingGate.length})`);
              await new Promise(r => setTimeout(r, 20000));
            }

            if (!testsGreen || !detGreen || !perfOk) {
              core.info(`Gates not green after wait (tests=${testsGreen} det=${detGreen} perf=${perfOk})`);
              return;
            }

            try {
              await github.rest.pulls.enableAutoMerge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info('Enabled native auto-merge');
            } catch (e) {
              core.info('enableAutoMerge not available: ' + e.message);
            }

            try {
              const title = pr.title.replace(/^\[WIP\]\s*/i, '');
              await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `${title} (#${pr.number})`,
                commit_message: [
                  'Autonomous merge: CI tests + Determinism (+ performance if present) green.',
                  `Head: ${sha}`,
                  'No stochastic MR; restrictions unchanged.',
                ].join('\n'),
                sha,
              });
              core.info(`Merged PR #${pr.number}`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: '**Autonomous merge** completed after green **CI** and **Determinism** checks.',
              });
              // Further pushes to a squash-merged branch are invisible to
              // auto-merge (no open PR). Delete the head so leftovers do not
              // look like an unmerged PR.
              const headRef = pr.head && pr.head.ref;
              if (headRef && headRef !== 'main') {
                try {
                  await github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${headRef}`,
                  });
                  core.info(`Deleted merged branch ${headRef}`);
                } catch (delErr) {
                  core.info('Branch delete skipped: ' + delErr.message);
                }
              }
            } catch (e) {
              core.warning('Merge failed: ' + e.message);
            }
