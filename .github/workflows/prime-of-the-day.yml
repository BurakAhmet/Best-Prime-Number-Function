# Fully autonomous daily deterministic prime challenge (no stochastic MR).
# Also appends path + e2e timings to docs/wiki/Hall-of-fame.md.
name: Prime of the day

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  potd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools for OpenMP wheel core
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1

      - run: pip install -e ".[fast]"
      - run: bash scripts/compile_wheel_core.sh

      - name: Compute deterministic challenge + e2e TIME
        id: potd
        env:
          NUMBA_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
        run: |
          python3 << 'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          import sys
          from is_prime import lab

          day = dt.datetime.now(dt.timezone.utc).date()
          ordinal = day.toordinal()
          n = 10**6 + (ordinal * 9973) % 10**6
          if n % 2 == 0:
              n += 1
          info = lab(n, parallel=True)
          # Fresh-process e2e CLI TIME (matches printed TIME metric).
          # python -m best_prime exits 0=prime, 1=composite (by design), 2=error —
          # do not treat composite as failure (that caused daily flaky reds).
          proc = subprocess.run(
              [sys.executable, "-m", "best_prime", str(n)],
              text=True,
              capture_output=True,
          )
          out = (proc.stdout or "") + (proc.stderr or "")
          if proc.returncode not in (0, 1):
              print(out, file=sys.stderr)
              raise SystemExit(
                  f"python -m best_prime failed with exit {proc.returncode} for n={n}"
              )
          e2e_ms = None
          for line in out.splitlines():
              m = re.match(r"TIME:\s+\d+\s+ns\s+\(([0-9.]+)\s+ms\)", line.strip())
              if m:
                  e2e_ms = float(m.group(1))
          payload = {
              "date": day.isoformat(),
              "n": n,
              "is_prime": info["is_prime"],
              "elapsed_ms": round(info["elapsed_ms"], 3),
              "e2e_ms": round(e2e_ms if e2e_ms is not None else info["e2e_ms"], 3),
              "path": info["path"],
              "isqrt": info["isqrt"],
          }
          print(json.dumps(payload, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"date={payload['date']}\n")
              f.write(f"n={payload['n']}\n")
              f.write(f"prime={'true' if payload['is_prime'] else 'false'}\n")
              f.write(f"ms={payload['elapsed_ms']}\n")
              f.write(f"e2e={payload['e2e_ms']}\n")
              f.write(f"path={payload['path']}\n")
          with open("potd.json", "w") as f:
              json.dump(payload, f, indent=2)
          PY

      - name: Append hall-of-fame log
        run: python3 scripts/append_hall_of_fame.py --json potd.json

      - name: Commit hall-of-fame update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wiki/Hall-of-fame.md
          if git diff --staged --quiet; then
            echo "No hall-of-fame changes"
          else
            git commit -m "docs: append prime-of-the-day ${{ steps.potd.outputs.date }} to hall of fame"
            git push
          fi

      - name: Upsert GitHub Issue (Prime of the day)
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const potd = JSON.parse(fs.readFileSync('potd.json', 'utf8'));
            const title = `Prime of the day — ${potd.date}`;
            const body = [
              `## Prime of the day — \`${potd.date}\``,
              '',
              'Autonomous deterministic challenge (UTC date → fixed odd `n`, then `is_prime` / `lab` + e2e CLI `TIME`).',
              '',
              `| | |`,
              `|---|---|`,
              `| **n** | \`${potd.n}\` |`,
              `| **Prime?** | **${potd.is_prime ? 'yes' : 'no'}** |`,
              `| **Path** | \`${potd.path}\` |`,
              `| **⌊√n⌋** | \`${potd.isqrt}\` |`,
              `| **Check** | ${potd.elapsed_ms} ms |`,
              `| **E2E TIME** | ${potd.e2e_ms} ms |`,
              '',
              'No stochastic Miller–Rabin. Reproduce:',
              '```bash',
              'bash scripts/compile_wheel_core.sh',
              `python is_prime.py --lab ${potd.n}`,
              `python is_prime.py ${potd.n}`,
              '```',
              '',
              'Logged in [Hall of fame](../blob/main/docs/wiki/Hall-of-fame.md).',
              '',
              '<sub>Posted by **Prime of the day** workflow (fully autonomous).</sub>',
            ].join('\n');

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'prime-of-the-day',
                color: '5319E7',
                description: 'Autonomous daily prime challenge',
              });
            } catch (_) {}
            // Close yesterday's (and any other open) prime-of-the-day issues.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prime-of-the-day',
              per_page: 20,
            });
            for (const issue of open.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed previous prime-of-the-day #${issue.number}`);
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['prime-of-the-day', 'agent/done', 'status/done', 'area/agents'],
            });
            core.info(`Prime of the day issue #${created.data.number}`);
