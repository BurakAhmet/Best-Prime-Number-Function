# Publish Python package to GitHub Packages (PyPI-compatible registry).
# Shows up under the repo "Packages" section.
name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note (does not change package version)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Owner + repository name in the upload URL (GitHub Packages PyPI registry)
          python -m twine upload \
            --repository-url "https://upload.pypi.pkg.github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}" \
            dist/*

      - name: Summary
        run: |
          echo "### Package published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry: GitHub Packages (PyPI)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install --index-url https://pypi.pkg.github.com/${{ github.repository_owner }}/simple/ \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  best-prime-number-function==1.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticate with a PAT (\`read:packages\`) as the pip password; username = your GitHub username." >> "$GITHUB_STEP_SUMMARY"
