# Publishes docs/wiki to GitHub Pages as a browsable wiki site.
# (Classic GitHub Wiki .wiki.git only appears after a first page is created in the UI;
#  GITHUB_TOKEN cannot create that remote. Pages works fully from Actions.)
name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static wiki site from docs/wiki
        run: |
          set -euo pipefail
          SITE=_site
          rm -rf "$SITE"
          mkdir -p "$SITE"
          cp docs/wiki/*.md "$SITE/"

          # Simple HTML index linking all pages (no external generators required)
          python3 << 'PY'
          from pathlib import Path
          import html
          site = Path("_site")
          files = sorted(p for p in site.glob("*.md") if not p.name.startswith("_"))
          links = "\n".join(
              f'    <li><a href="{p.name}">{html.escape(p.stem.replace("-", " "))}</a></li>'
              for p in files
          )
          index = f"""<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Best-Prime-Number-Function Wiki</title>
  <style>
    body {{ font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }}
    .warn {{ background: #fff3cd; border: 1px solid #ffecb5; padding: 0.75rem 1rem; border-radius: 6px; }}
    code {{ background: #f4f4f4; padding: 0.1em 0.3em; border-radius: 4px; }}
  </style>
</head>
<body>
  <h1>Best-Prime-Number-Function Wiki</h1>
  <p class="warn"><strong>Warning:</strong> This repository and wiki content were largely created by an <strong>AI agent</strong>. Review before production use.</p>
  <p>Source of truth: <code>docs/wiki/</code> in the main repo (updated by agents/humans; published by this workflow).</p>
  <h2>Pages</h2>
  <ul>
{links}
  </ul>
  <p><a href="https://github.com/BurakAhmet/Best-Prime-Number-Function">GitHub repository</a></p>
</body>
</html>
"""
          (site / "index.html").write_text(index)
          # Minimal HTML wrappers so .md files are downloadable/viewable as text
          for p in files:
              title = html.escape(p.stem.replace("-", " "))
              body = html.escape(p.read_text())
              (site / f"{p.stem}.html").write_text(
                  f"""<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>{title}</title>
<style>body{{font-family:system-ui,sans-serif;max-width:48rem;margin:2rem auto;padding:0 1rem}}
pre{{white-space:pre-wrap;word-break:break-word;background:#f6f8fa;padding:1rem;border-radius:8px}}</style>
</head><body><p><a href="index.html">← Wiki home</a></p><h1>{title}</h1>
<pre>{body}</pre></body></html>"""
              )
          print("Built", len(files), "pages")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
