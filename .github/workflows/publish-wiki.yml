name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "docs/guide/**"
      - "docs/theme/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "pyproject.toml"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:
  # Auto-merge and Prime-of-the-day push with GITHUB_TOKEN, which does not
  # start other `on: push` workflows. workflow_run is the supported hook.
  workflow_run:
    workflows: ["Auto-merge", "Prime of the day", "Optimize"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-wiki
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_run" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$WR_CONCLUSION" != "success" ]; then
            echo "upstream $WR_NAME conclusion=$WR_CONCLUSION — skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$WR_NAME" = "Prime of the day" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$WR_NAME" = "Auto-merge" ]; then
            if gh run view "$WR_ID" --repo "${{ github.repository }}" --log \
                 | grep -q "Merged PR #"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Auto-merge $WR_ID did not merge a PR — skip"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$WR_NAME" = "Optimize" ]; then
            if gh run view "$WR_ID" --repo "${{ github.repository }}" --log \
                 | grep -q "Merged optimize PR #"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Optimize $WR_ID did not merge a PR — skip"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown renderer and MkDocs
        run: pip install markdown "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"

      - name: Build exhibit wiki (Pages root)
        run: python3 docs/wiki/build_site.py _site

      - name: Build library guide into /guide/
        run: mkdocs build --strict --site-dir _site/guide

      - name: Assert pages compiled (not raw Markdown dumps)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("_site")
          index = (site / "index.html").read_text(encoding="utf-8")
          assert "<table" in index, "Home page should contain rendered tables"
          assert "<pre>" not in index or "<code>" in index
          assert "callout" in index or "Warning" in index
          assert not (site / "Home.md").exists(), "do not publish raw .md as primary pages"
          hist = site / "Algorithm-history.html"
          assert hist.is_file() and "<h1" in hist.read_text(encoding="utf-8")
          assert 'id="prime-lab-root"' in index
          assert (site / "assets" / "checker.js").is_file()
          assert (site / "assets" / "checker-worker.js").is_file()
          assert (site / "assets" / "og.png").is_file()
          assert (site / "assets" / "potd.json").is_file()
          assert 'class="acta"' in index
          assert 'og:image' in index
          assert "lab-orrery" in (site / "assets" / "checker.js").read_text(encoding="utf-8")
          assert 'href="guide/"' in index, "exhibit must link to the library guide"
          guide = site / "guide" / "index.html"
          assert guide.is_file(), "mkdocs must land at _site/guide/"
          api = (site / "guide" / "api" / "index.html").read_text(encoding="utf-8")
          assert "is_prime" in api and "totient" in api and "primorial" in api
          assert not (site / "guide" / "Home.md").exists()
          print("wiki HTML + /guide/ compile checks OK")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
