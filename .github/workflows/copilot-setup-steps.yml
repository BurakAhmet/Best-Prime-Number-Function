# Environment Copilot coding agent runs before it starts editing.
# Job name must be copilot-setup-steps.
# https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
name: Copilot setup steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: OpenMP + package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1
          pip install -e ".[fast,test]"
          bash scripts/compile_wheel_core.sh
