# Build sdist + manylinux wheels and publish to PyPI (Trusted Publishing).
# Configure a pending publisher on pypi.org:
#   owner=BurakAhmet, repo=Best-Prime-Number-Function,
#   workflow=publish-pypi.yml, environment=pypi
name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel-linux:
    name: manylinux x86_64 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build portable platform wheel in manylinux
        run: |
          mkdir -p wheelhouse
          docker run --rm --volume "$PWD":/src --workdir /src \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -lc '
              set -euo pipefail
              # Image already has gcc+OpenMP; libgomp-devel is not in manylinux_2_28.
              dnf -y install libgomp || true
              PY=/opt/python/cp312-cp312/bin/python
              "$PY" -m pip install -U pip build auditwheel
              BEST_PRIME_REQUIRE_NATIVE=1 BEST_PRIME_PORTABLE=1 \
                "$PY" -m build --wheel --outdir /tmp/built
              "$PY" -m auditwheel repair /tmp/built/*.whl -w /src/wheelhouse
            '
          python3 - <<'PY'
          from pathlib import Path
          wheels = list(Path("wheelhouse").glob("*.whl"))
          assert wheels, "no repaired wheel"
          name = wheels[0].name
          assert "none-any" not in name, name
          assert "manylinux" in name, name
          print("ok", name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

  wheel-macos:
    name: macOS wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install libomp
        run: brew install libomp
      - name: Build portable platform wheel
        env:
          BEST_PRIME_REQUIRE_NATIVE: "1"
          BEST_PRIME_PORTABLE: "1"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          ARCHFLAGS: "-arch arm64"
          _PYTHON_HOST_PLATFORM: "macosx-11.0-arm64"
        run: |
          python -m pip install -U pip build delocate
          python -m build --wheel --outdir /tmp/built
          mkdir -p wheelhouse
          # Vendor libomp; if delocate disagrees with the tag, still ship the wheel.
          delocate-wheel -w wheelhouse /tmp/built/*.whl \
            || cp /tmp/built/*.whl wheelhouse/
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path("wheelhouse").glob("*.whl"))
          assert wheels, "no macOS wheel"
          name = wheels[0].name
          assert "none-any" not in name, name
          print("ok", name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheel-linux, wheel-macos]
    if: >-
      always() &&
      needs.sdist.result == 'success' &&
      (needs.wheel-linux.result == 'success' || needs.wheel-macos.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;
          ls -la upload
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
        continue-on-error: true
      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
