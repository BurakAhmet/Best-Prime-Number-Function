# Ensures every push/PR remains deterministic: same inputs always yield the same
# boolean result across repeated serial and parallel calls.
#
# PR-lite: Python 3.12 only. Full multi-version matrix on push to main.
# Docs-only PRs: gate job still reports the required "Determinism" check as green.
name: Determinism

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUMBA_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"

jobs:
  plan:
    name: Plan determinism scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      full: ${{ steps.scope.outputs.full }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: scope
        run: bash scripts/ci_change_scope.sh "$GITHUB_OUTPUT"
      - id: matrix
        run: |
          if [ "${{ steps.scope.outputs.full }}" = "true" ]; then
            matrix='["3.9","3.11","3.12"]'
          else
            matrix='["3.12"]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  determinism:
    name: Repeated-trial determinism (Python ${{ matrix.python-version }})
    needs: [plan]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tools for OpenMP wheel core
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,test]"

      - name: Build wheel_core.so
        run: bash scripts/compile_wheel_core.sh

      - name: Unit tests for determinism class
        run: pytest -q tests/test_determinism.py tests/test_is_prime.py::TestDeterminism tests/test_is_prime.py::TestParallelSerial tests/test_lab.py::TestLabContract

      - name: Multi-trial determinism script
        run: python benchmarks/check_determinism.py --trials 7

      - name: Cross-process determinism (two interpreters, same inputs)
        run: |
          python benchmarks/check_determinism.py --trials 3 > /tmp/det1.txt
          python benchmarks/check_determinism.py --trials 3 > /tmp/det2.txt
          # Both must pass; compare the OK lines (ignore timing-free status text)
          grep -E '^(  OK|Determinism check PASSED)' /tmp/det1.txt > /tmp/ok1.txt
          grep -E '^(  OK|Determinism check PASSED)' /tmp/det2.txt > /tmp/ok2.txt
          diff -u /tmp/ok1.txt /tmp/ok2.txt

  # Branch protection requires a check literally named "Determinism".
  # Matrix cells are "Repeated-trial determinism (Python X)" and would
  # otherwise leave that required context pending forever (blocking merge).
  gate:
    name: Determinism
    if: always()
    needs: [plan, determinism]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success (or docs-only skip)
        run: |
          code="${{ needs.plan.outputs.code }}"
          result="${{ needs.determinism.result }}"
          if [ "$code" = "false" ]; then
            echo "Docs/meta-only change — Determinism suite skipped; gate green."
            exit 0
          fi
          case "$result" in
            success) echo "Determinism matrix green" ;;
            skipped)
              # Matrix job skipped unexpectedly while code=true
              echo "Determinism matrix skipped while code changes present" >&2
              exit 1
              ;;
            *)
              echo "Determinism matrix: $result" >&2
              exit 1
              ;;
          esac
