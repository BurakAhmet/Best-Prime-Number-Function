# Full @pytest.mark.slow suite — does not block PR CI (issue #5).
name: Nightly slow tests

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NUMBA_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgomp1
      - run: pip install -e ".[fast,test]"
      - run: bash scripts/compile_wheel_core.sh
      - run: pytest -q -m slow
      # P200 ~1 min here. Fail only on a wrong verdict, never on slowness.
      - name: Timing table (nightly)
        run: python3 benchmarks/timing_table.py --band nightly --json timing_nightly.json
      - uses: actions/upload-artifact@v4
        with:
          name: timing-table-nightly
          path: timing_nightly.json
