# Optional Read the Docs build of the same MkDocs guide.
# Canonical public URL remains GitHub Pages /guide/.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
