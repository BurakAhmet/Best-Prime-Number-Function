[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-prime-number-function"
version = "1.10.0"
description = "Fully deterministic primality, π(n), factoring, and arithmetic (OpenMP C / Numba / AKS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BurakAhmet", email = "ahmetburakbicer@gmail.com" }]
keywords = [
  "prime",
  "primality",
  "next-prime",
  "deterministic",
  "openmp",
  "numba",
  "aks",
  "trial-division",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Native OpenMP core is built automatically when gcc+OpenMP are available.
# NumPy/Numba are optional: hard 64-bit / Lucy π without a compiler still
# benefit from `[fast]`. Pure install uses stdlib wheels + Python Lucy.
fast = ["numpy>=1.22", "numba>=0.56"]
test = ["pytest>=7.0", "hypothesis>=6.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = [
  "pytest>=7.0",
  "hypothesis>=6.0",
  "build",
  "wheel",
  "numpy>=1.22",
  "numba>=0.56",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[project.urls]
Homepage = "https://github.com/BurakAhmet/Best-Prime-Number-Function"
Repository = "https://github.com/BurakAhmet/Best-Prime-Number-Function"
Issues = "https://github.com/BurakAhmet/Best-Prime-Number-Function/issues"
Changelog = "https://github.com/BurakAhmet/Best-Prime-Number-Function/blob/main/CHANGELOG.md"
Documentation = "https://burakahmet.github.io/Best-Prime-Number-Function/guide/"

[project.scripts]
is-prime = "best_prime.is_prime:main"
best-prime = "best_prime.is_prime:main"
next-prime = "best_prime.next_prime:main"
prev-prime = "best_prime.prime_cli:prev_prime_main"
nth-prime = "best_prime.prime_cli:nth_prime_main"
prime-count = "best_prime.prime_cli:prime_count_main"
primes = "best_prime.prime_cli:primes_main"
primerange = "best_prime.prime_cli:primerange_main"
prime-factors = "best_prime.prime_cli:prime_factors_main"
is-prime-power = "best_prime.prime_cli:is_prime_power_main"
is-perfect-power = "best_prime.prime_cli:is_perfect_power_main"
totient = "best_prime.prime_cli:totient_main"
primorial = "best_prime.prime_cli:primorial_main"
divisors = "best_prime.prime_cli:divisors_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: long-running 64-bit full trial division (skip in default CI)",
]

[tool.setuptools]
# Compatibility CLI shim + data package + best_prime implementation.
py-modules = ["is_prime", "next_prime"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["is_prime_data*", "best_prime*"]

# Do not ship a prebuilt .so in the pure wheel (platform-specific).
# setup.py builds wheel_core.so during install when a compiler is available.
[tool.setuptools.package-data]
is_prime_data = ["*.npy", "*.u8", "*.u16", "*.py", "*.c"]
best_prime = ["py.typed"]
