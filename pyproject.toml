[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "best-prime-number-function"
version = "1.1.1"
description = "Fully deterministic primality testing (tiered wheels, OpenMP C, Numba fallback; AKS for big ints)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BurakAhmet" }]
keywords = ["prime", "primality", "deterministic", "openmp", "numba", "aks", "trial-division"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.22",
  "numba>=0.56",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
is-prime = "is_prime:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: long-running 64-bit full trial division (skip in default CI)",
]

[tool.setuptools]
py-modules = ["is_prime"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["is_prime_data*"]

[tool.setuptools.package-data]
is_prime_data = ["*.npy", "*.u8", "*.u16", "*.py", "*.c", "*.so"]
