[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-prime-number-function"
version = "1.11.2"
description = "Fully deterministic primality, π(n), factoring, and arithmetic (OpenMP C / Numba / AKS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BurakAhmet", email = "ahmetburakbicer@gmail.com" }]
keywords = [
  "prime",
  "primality",
  "next-prime",
  "deterministic",
  "openmp",
  "numba",
  "aks",
  "trial-division",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Native OpenMP core is built automatically when gcc+OpenMP are available.
# NumPy/Numba are optional: hard 64-bit / Lucy π without a compiler still
# benefit from `[fast]`. Pure install uses stdlib wheels + Python Lucy.
fast = ["numpy>=1.22", "numba>=0.56"]
test = ["pytest>=7.0", "hypothesis>=6.0", "pytest-cov>=4.0"]
lint = ["ruff>=0.6", "mypy>=1.8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = [
  "pytest>=7.0",
  "hypothesis>=6.0",
  "pytest-cov>=4.0",
  "ruff>=0.6",
  "mypy>=1.8",
  "build",
  "wheel",
  "numpy>=1.22",
  "numba>=0.56",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[project.urls]
Homepage = "https://github.com/BurakAhmet/Best-Prime-Number-Function"
Repository = "https://github.com/BurakAhmet/Best-Prime-Number-Function"
Issues = "https://github.com/BurakAhmet/Best-Prime-Number-Function/issues"
Changelog = "https://github.com/BurakAhmet/Best-Prime-Number-Function/blob/main/CHANGELOG.md"
Documentation = "https://burakahmet.github.io/Best-Prime-Number-Function/guide/"

[project.scripts]
is-prime = "best_prime.is_prime:main"
best-prime = "best_prime.is_prime:main"
next-prime = "best_prime.next_prime:main"
prev-prime = "best_prime.prime_cli:prev_prime_main"
nth-prime = "best_prime.prime_cli:nth_prime_main"
prime-count = "best_prime.prime_cli:prime_count_main"
primes = "best_prime.prime_cli:primes_main"
primerange = "best_prime.prime_cli:primerange_main"
prime-factors = "best_prime.prime_cli:prime_factors_main"
is-prime-power = "best_prime.prime_cli:is_prime_power_main"
is-perfect-power = "best_prime.prime_cli:is_perfect_power_main"
totient = "best_prime.prime_cli:totient_main"
primorial = "best_prime.prime_cli:primorial_main"
divisors = "best_prime.prime_cli:divisors_main"
primality-certificate = "best_prime.prime_cli:primality_certificate_main"
next-primes = "best_prime.prime_cli:next_primes_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: long-running 64-bit full trial division (skip in default CI)",
]

[tool.setuptools]
# Implementation is the best_prime package + is_prime_data tables.
include-package-data = true

[tool.setuptools.packages.find]
include = ["is_prime_data*", "best_prime*"]

# Raw wheel tables (.u8/.u16) are the source of truth. .npy is optional
# (generated on demand). The native .so/.dylib is built at install / cibuildwheel
# and included in *platform* wheels only.
[tool.setuptools.package-data]
is_prime_data = ["*.u8", "*.u16", "*.py", "*.c", "wheel_core.so", "wheel_core.dylib", "wheel_core.dll"]
best_prime = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["best_prime", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E402",  # late imports: CLI TIME starts at import
  "E501",  # existing long lines; format does not wrap them all
]

[tool.ruff.lint.per-file-ignores]
"is_prime_data/*" = ["ALL"]
"scripts/generate_wheel_core_c.py" = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
follow_imports = "silent"
files = [
  "best_prime/certificate.py",
  "best_prime/factor_ecm.py",
  "best_prime/factor_siqs.py",
]

[tool.coverage.run]
source = ["best_prime"]
branch = true
omit = ["best_prime/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.cibuildwheel]
# ctypes .so is tagged py3-none-<plat> by setup.py. One CPython is enough to
# compile it; do not install an ancient yum gcc over the manylinux toolchain.
build = "cp312-*"
skip = "pp* *-win32 *-manylinux_i686 *-musllinux*"
test-command = "python -c \"from best_prime import is_prime, lab; assert is_prime(17) and not is_prime(100); assert lab(1_000_000_007)['path'] == 'u64_wheel_c'\""
environment = { BEST_PRIME_REQUIRE_NATIVE = "1", BEST_PRIME_PORTABLE = "1" }

[tool.cibuildwheel.linux]
before-all = "dnf install -y libgomp-devel || yum install -y libgomp-devel || true"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { CC = "clang", BEST_PRIME_REQUIRE_NATIVE = "1", BEST_PRIME_PORTABLE = "1" }
